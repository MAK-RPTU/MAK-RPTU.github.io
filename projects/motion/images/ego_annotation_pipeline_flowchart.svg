<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1370" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A4664"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#02C39A"/>
    </marker>
  </defs>

  <rect width="980" height="1370" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="490" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#10182B">Egocentric Video → Robot-Ready Actions: Annotation Pipeline</text>
  <text x="490" y="72" text-anchor="middle" font-size="14" fill="#5A6B8C">Learning-from-Demonstration supervision for humanoid VLAs (GR00T N1.7 / π0.5) — four layers, never faked ground truth</text>

  <!-- INPUT -->
  <rect x="160" y="95" width="660" height="86" rx="12" fill="#10182B"/>
  <text x="490" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Egocentric rig capture → MCAP</text>
  <text x="490" y="142" text-anchor="middle" font-size="11.5" fill="#CADCFC">RGB (H.264) · metric depth / calibrated stereo · intrinsics · IMU (100–200 Hz)</text>
  <text x="490" y="160" text-anchor="middle" font-size="11.5" fill="#CADCFC">one clock, many channels (Foxglove container) — bare MP4 rejected: no depth → no metric scale</text>

  <line x1="490" y1="181" x2="490" y2="211" stroke="#3A4664" stroke-width="2" marker-end="url(#arr)"/>

  <!-- INGEST -->
  <rect x="210" y="213" width="560" height="64" rx="10" fill="#EEF3FE" stroke="#B9C8E8"/>
  <text x="490" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#10182B">1 · Ingest &amp; signal QC</text>
  <text x="490" y="257" text-anchor="middle" font-size="11" fill="#3A4664">demux channels · depth-unit sanity check (mm vs TUM 5000/m) · loud, tagged failures</text>

  <!-- split -->
  <line x1="490" y1="277" x2="490" y2="296" stroke="#3A4664" stroke-width="2"/>
  <line x1="250" y1="296" x2="730" y2="296" stroke="#3A4664" stroke-width="2"/>
  <line x1="250" y1="296" x2="250" y2="318" stroke="#3A4664" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="730" y1="296" x2="730" y2="318" stroke="#3A4664" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ODOMETRY branch -->
  <rect x="70" y="320" width="360" height="108" rx="10" fill="#EEF3FE" stroke="#B9C8E8"/>
  <text x="250" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#10182B">2a · Odometry / SLAM</text>
  <text x="250" y="365" text-anchor="middle" font-size="11" fill="#3A4664">sparse VIO: Lucas-Kanade tracks → depth-lift → PnP RANSAC</text>
  <text x="250" y="382" text-anchor="middle" font-size="11" fill="#3A4664">pose-graph SLAM: ORB loop closure, SE(3) graph → kills drift</text>
  <text x="250" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#02735E">→ T_world←camera (per frame)</text>

  <!-- HANDS branch -->
  <rect x="550" y="320" width="360" height="108" rx="10" fill="#EEF3FE" stroke="#B9C8E8"/>
  <text x="730" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#10182B">2b · 3D Hands</text>
  <text x="730" y="365" text-anchor="middle" font-size="11" fill="#3A4664">WiLoR (MANO) → refit with true intrinsics</text>
  <text x="730" y="382" text-anchor="middle" font-size="11" fill="#3A4664">depth-snap: metric depth fixes monocular scale (found ~8% bias)</text>
  <text x="730" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#02735E">→ T_camera←wrist + 21 keypoints/hand</text>

  <!-- join to compose -->
  <line x1="250" y1="428" x2="250" y2="450" stroke="#3A4664" stroke-width="2"/>
  <line x1="730" y1="428" x2="730" y2="450" stroke="#3A4664" stroke-width="2"/>
  <line x1="250" y1="450" x2="730" y2="450" stroke="#3A4664" stroke-width="2"/>
  <line x1="490" y1="450" x2="490" y2="470" stroke="#3A4664" stroke-width="2" marker-end="url(#arr)"/>

  <!-- COMPOSE -->
  <rect x="200" y="472" width="580" height="78" rx="10" fill="#10182B"/>
  <text x="490" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">3 · Compose transforms</text>
  <text x="490" y="519" text-anchor="middle" font-size="13" fill="#7EF0D4" font-family="Courier New, monospace">T_world←wrist = T_world←camera · T_camera←wrist</text>
  <text x="490" y="538" text-anchor="middle" font-size="11" fill="#CADCFC">world-frame wrist trajectories · per-frame validity masks (masked, never interpolated) · smoothing</text>

  <line x1="490" y1="550" x2="490" y2="572" stroke="#3A4664" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SEMANTICS row -->
  <rect x="60" y="574" width="270" height="86" rx="10" fill="#EEF3FE" stroke="#B9C8E8"/>
  <text x="195" y="599" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#10182B">4 · Objects</text>
  <text x="195" y="619" text-anchor="middle" font-size="11" fill="#3A4664">YOLO-World, open-vocabulary</text>
  <text x="195" y="636" text-anchor="middle" font-size="11" fill="#3A4664">(vocab = the task's tools) → tracked boxes</text>

  <rect x="355" y="574" width="270" height="86" rx="10" fill="#EEF3FE" stroke="#B9C8E8"/>
  <text x="490" y="599" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#10182B">5 · Segment candidates</text>
  <text x="490" y="619" text-anchor="middle" font-size="11" fill="#3A4664">kinematic boundary detection</text>
  <text x="490" y="636" text-anchor="middle" font-size="11" fill="#3A4664">→ candidate boundaries + keyframes</text>

  <rect x="650" y="574" width="270" height="86" rx="10" fill="#EEF3FE" stroke="#B9C8E8"/>
  <text x="785" y="599" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#10182B">6 · Semantic labeling</text>
  <text x="785" y="619" text-anchor="middle" font-size="11" fill="#3A4664">VLM: Gemini Robotics-ER 2 over video</text>
  <text x="785" y="636" text-anchor="middle" font-size="11" fill="#3A4664">verb / object / failure-mode, controlled vocab</text>

  <line x1="195" y1="660" x2="195" y2="680" stroke="#3A4664" stroke-width="2"/>
  <line x1="490" y1="660" x2="490" y2="680" stroke="#3A4664" stroke-width="2"/>
  <line x1="785" y1="660" x2="785" y2="680" stroke="#3A4664" stroke-width="2"/>
  <line x1="195" y1="680" x2="785" y2="680" stroke="#3A4664" stroke-width="2"/>
  <line x1="490" y1="680" x2="490" y2="700" stroke="#3A4664" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ACTIONS -->
  <rect x="180" y="702" width="620" height="80" rx="10" fill="#10182B"/>
  <text x="490" y="728" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">7 · Robot-ready delta actions</text>
  <text x="490" y="749" text-anchor="middle" font-size="13" fill="#7EF0D4" font-family="Courier New, monospace">a_t = inv(T_t) · T_{t+1}   (per wrist)  + gripper aperture</text>
  <text x="490" y="768" text-anchor="middle" font-size="11" fill="#CADCFC">consecutive-pose differences → slow SLAM drift cancels · bounded by hand-stage jitter, not SLAM</text>

  <line x1="490" y1="782" x2="490" y2="804" stroke="#3A4664" stroke-width="2" marker-end="url(#arr)"/>

  <!-- EXPORT / QA -->
  <rect x="150" y="806" width="320" height="66" rx="10" fill="#EEF3FE" stroke="#B9C8E8"/>
  <text x="310" y="831" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#10182B">8 · Export annotated MCAP</text>
  <text x="310" y="851" text-anchor="middle" font-size="11" fill="#3A4664">derived layers re-emitted · Foxglove-playable</text>

  <rect x="510" y="806" width="320" height="66" rx="10" fill="#EEF3FE" stroke="#B9C8E8"/>
  <text x="670" y="831" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#10182B">9 · Overlay QA video + viewer</text>
  <text x="670" y="851" text-anchor="middle" font-size="11" fill="#3A4664">skeletons · boxes · 3D SLAM scene · QC gates, one clock</text>

  <line x1="310" y1="872" x2="310" y2="892" stroke="#3A4664" stroke-width="2"/>
  <line x1="670" y1="872" x2="670" y2="892" stroke="#3A4664" stroke-width="2"/>
  <line x1="310" y1="892" x2="670" y2="892" stroke="#3A4664" stroke-width="2"/>
  <line x1="490" y1="892" x2="490" y2="912" stroke="#02C39A" stroke-width="2.5" marker-end="url(#arrg)"/>

  <!-- RETARGET VERIFY GATE -->
  <rect x="120" y="914" width="740" height="150" rx="12" fill="#F2FBF8" stroke="#02C39A" stroke-width="2"/>
  <text x="490" y="941" text-anchor="middle" font-size="15" font-weight="bold" fill="#02735E">Verification gate: retarget-to-robot BEFORE training</text>
  <text x="490" y="963" text-anchor="middle" font-size="11.5" fill="#1E2761">world wrists → robot base frame (optical→FLU, scale, anchor) · pelvis pinned, legs/waist frozen (unobserved in egocentric view)</text>
  <text x="490" y="983" text-anchor="middle" font-size="11.5" fill="#1E2761">mink differential IK on MuJoCo (task-space QP, joint limits) · G1 29-DoF + Inspire hands (GMR conventions) · ~2 mm mean wrist error</text>
  <text x="490" y="1003" text-anchor="middle" font-size="11.5" fill="#1E2761">WiLoR 21 keypoints → finger curls → 12 Inspire joints/hand · → KIMODO playback frames → live MuJoCo replay in the viewer</text>
  <text x="490" y="1030" text-anchor="middle" font-size="12" font-weight="bold" fill="#02735E">Purpose: cheap visual sanity check — geometry right, hands not inside-out, motion not flipped —</text>
  <text x="490" y="1048" text-anchor="middle" font-size="12" font-weight="bold" fill="#02735E">before spending GPU-days. Produces no training data; produces trust.</text>

  <line x1="490" y1="1064" x2="490" y2="1086" stroke="#3A4664" stroke-width="2" marker-end="url(#arr)"/>

  <!-- TRAINING -->
  <rect x="255" y="1088" width="470" height="72" rx="12" fill="#10182B"/>
  <text x="490" y="1116" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">VLA fine-tuning: GR00T N1.7 / π0.5</text>
  <text x="490" y="1138" text-anchor="middle" font-size="11.5" fill="#CADCFC">accepted, labelled episodes: delta actions + gripper + segments → policy supervision</text>

  <!-- FOUR LAYERS legend -->
  <rect x="60" y="1195" width="860" height="140" rx="10" fill="#FAFBFE" stroke="#D8E0F0"/>
  <text x="80" y="1222" font-size="13" font-weight="bold" fill="#10182B">The four-layer pattern (each layer carries confidence / validity masks — invalid → masked, never interpolated):</text>
  <text x="90" y="1248" font-size="12" fill="#3A4664"><tspan font-weight="bold" fill="#10182B">L1 Measured signals</tspan> — RGB, depth, IMU, intrinsics (what sensors actually recorded)</text>
  <text x="90" y="1270" font-size="12" fill="#3A4664"><tspan font-weight="bold" fill="#10182B">L2 Geometric pseudo-labels</tspan> — camera pose, 3D hands, world wrists (derived, not measured)</text>
  <text x="90" y="1292" font-size="12" fill="#3A4664"><tspan font-weight="bold" fill="#10182B">L3 Structured semantics</tspan> — segments: verb / object / failure mode (controlled vocabulary)</text>
  <text x="90" y="1314" font-size="12" fill="#3A4664"><tspan font-weight="bold" fill="#10182B">L4 Robot-ready actions</tspan> — per-frame wrist deltas + gripper, the supervision a policy trains on</text>
</svg>
